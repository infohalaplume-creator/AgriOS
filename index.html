<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 AgriOS - نظام إدارة المزرعة</title>
  <style>
    :root {
      --primary: #0F3B2C; --primary-light: #2D6A4F; --bg: #F8FAF9; --card: #FFFFFF;
      --text: #1e1e1e; --border: #dcdcdc; --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 12px; --danger-bg: #fff5f5; --warning-bg: #fff8e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    header {
      background: var(--primary); color: white; padding: 12px 20px;
      font-size: 1.5em; font-weight: bold; display: flex; align-items: center; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 101;
    }
    header span { font-size: 1.8em; }
    nav.tabs {
      background: var(--card); box-shadow: var(--shadow); display: flex; flex-wrap: wrap; gap: 6px;
      padding: 10px 16px; position: sticky; top: 56px; z-index: 100; overflow-x: auto;
    }
    nav.tabs button {
      background: transparent; border: none; padding: 8px 16px; border-radius: 20px;
      font-size: 14px; font-weight: 600; color: #555; cursor: pointer; white-space: nowrap; transition: 0.2s;
    }
    nav.tabs button.active { background: var(--primary); color: white; }
    .container { flex: 1; padding: 16px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .tab-content { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
    h2 { color: var(--primary); margin-bottom: 12px; }
    h3 { color: var(--primary-light); margin-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: right; }
    th { background: #f0f7f0; color: var(--primary); font-weight: 700; }
    button {
      background: var(--primary); color: white; border: none; border-radius: 20px; padding: 10px 20px;
      font-size: 14px; font-weight: 600; cursor: pointer; margin: 4px 2px; transition: 0.2s;
    }
    button:hover { background: #1a4e33; }
    button.secondary { background: white; color: var(--primary); border: 1px solid var(--primary); }
    button.danger { background: #b00020; }
    button.edit-btn { background: #f9a825; color: #000; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 14px; margin: 6px 0 12px;
    }
    .expired-row { background-color: var(--danger-bg); }
    .expired-badge { background: #b00020; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .warning-badge { background: #f9a825; color: #000; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .success-badge { background: #2e7d32; color: white; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white; border-radius: var(--radius); padding: 24px; max-width: 600px;
      width: 90%; max-height: 85vh; overflow-y: auto;
    }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #323232; color: white; padding: 12px 24px; border-radius: 24px;
      font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 300;
    }
    .toast.show { opacity: 1; }
    .flex-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  </style>
</head>
<body>
  <header>🌾 AgriOS</header>
  <nav class="tabs" id="mainTabs"></nav>
  <div class="container" id="tabContainer"></div>
  <div class="toast" id="toast"></div>
  <div class="modal" id="genericModal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    const AppData = {
      chartOfAccounts: [],
      projects: [],
      inventory: [],
      personnel: [],
      tasks: [],
      journalEntries: [],
      calendarEntries: [],
      suppliers: [],
      purchaseInvoices: [],
      purchaseReturns: [],
      salesInvoices: [],
      salesReturns: [],
      servicePurchaseInvoices: [],
      servicePurchaseReturns: [],
      serviceSalesInvoices: [],
      serviceSalesReturns: [],
      contracts: [],
      training: [],
      maintenanceLog: [],
      assets: [],
      contractTypes: ['خدمات', 'توريد', 'استشارات', 'صيانة', 'أخرى'],
      trainingMedia: [],
      banks: [],
      bankTransactions: [],
      bankReconciliations: [],
      checks: [],
      treasury: { openingBalance: 0, transactions: [] },
      knowledge: [],
      channels: [],
      settings: { companyName: 'مزرعتي', language: 'ar' },
      cropTemplates: {
        'فراولة': [
          { day: 0, operation: 'حرث وتجهيز الأرض', cost: 200 },
          { day: 15, operation: 'زراعة الشتلات', cost: 3000 },
          { day: 60, operation: 'تسميد', cost: 400 },
          { day: 120, operation: 'حصاد', cost: 500 }
        ]
      }
    };

    // ======================== دوال المحاسبة المركزية ========================
    function getFlatAccounts() {
      const main = [
        { code: '1210', name: 'النقدية (الخزينة)' }, { code: '1220', name: 'أصول ثابتة' },
        { code: '1230', name: 'مدينون (عملاء)' }, { code: '1240', name: 'ميزانيات المشاريع' },
        { code: '1250', name: 'شيكات مستلمة' }, { code: '1260', name: 'شيكات واجبة الدفع' },
        { code: '2210', name: 'دائنون (موردون)' }, { code: '2310', name: 'مستحقات موظفين' },
        { code: '4100', name: 'مبيعات بضاعة' }, { code: '4200', name: 'إيرادات خدمات' },
        { code: '5100', name: 'تكاليف زراعية' }, { code: '5200', name: 'إنتاج جاهز' },
        { code: '5400', name: 'صيانة' }, { code: '5600', name: 'تدريب' },
        { code: '5700', name: 'مصروفات إدارية' }, { code: '5800', name: 'مصروفات بنكية' }
      ];
      return [...main, ...AppData.chartOfAccounts];
    }

    function addSubAccount(parentCode, entityName, entityType) {
      const cleanName = entityName.replace(/\s+/g, '');
      const code = parentCode + '-' + cleanName;
      if (!AppData.chartOfAccounts.find(a => a.code === code)) {
        AppData.chartOfAccounts.push({ code, name: entityName, type: entityType || 'فرعي' });
        saveData();
      }
      return code;
    }

    function genJE(debit, credit, amount, desc = '') {
      AppData.journalEntries.push({ id: Date.now(), date: new Date().toISOString().slice(0,10), debit, credit, amount, desc });
      saveData();
    }

    function addTreasuryMovement(type, amount, desc, relatedAccount) {
      AppData.treasury.transactions.push({
        id: Date.now(), date: new Date().toISOString().slice(0,10), type, amount, desc, relatedAccount
      });
      saveData();
    }

    function getTreasuryBalance() {
      return AppData.treasury.transactions.reduce((sum, t) => sum + (t.type === 'مقبوضات' ? t.amount : -t.amount), AppData.treasury.openingBalance);
    }

    function addBankTransaction(bankId, type, amount, desc, relatedAccount) {
      AppData.bankTransactions.push({
        id: Date.now(), bankId, date: new Date().toISOString().slice(0,10), type, amount, desc, relatedAccount
      });
      saveData();
    }

    function renderAccountSelectorHTML(parentCode, selectedCode = '', placeholder = 'اختر الحساب') {
      const accounts = getFlatAccounts().filter(a => a.code.startsWith(parentCode));
      let html = `<select class="account-select" data-parent="${parentCode}" onchange="toggleNewAccountInput(this)">`;
      html += `<option value="">${placeholder}</option>`;
      accounts.forEach(acc => {
        const sel = acc.code === selectedCode ? 'selected' : '';
        html += `<option value="${acc.code}" ${sel}>${acc.code} - ${acc.name}</option>`;
      });
      html += `<option value="__new__">➕ إنشاء حساب جديد</option></select>`;
      html += `<input type="text" class="new-account-name" placeholder="اسم الحساب الجديد" style="display:none; margin-top:4px;" onblur="createAccountFromInput(this)" />`;
      return html;
    }

    function toggleNewAccountInput(selectEl) {
      const input = selectEl.parentElement.querySelector('.new-account-name');
      input.style.display = selectEl.value === '__new__' ? 'block' : 'none';
    }

    function createAccountFromInput(inputEl) {
      const container = inputEl.parentElement;
      const select = container.querySelector('.account-select');
      const parentCode = select.dataset.parent;
      const name = inputEl.value.trim();
      if (!name) return;
      const code = addSubAccount(parentCode, name, 'فرعي');
      container.querySelector('.account-select').innerHTML = renderAccountSelectorHTML(parentCode, code, 'اختر الحساب');
      inputEl.style.display = 'none';
      showToast('تم إنشاء الحساب: ' + code);
    }

    function getSelectedAccount(containerEl) {
      const select = containerEl.querySelector('.account-select');
      if (!select) return null;
      if (select.value === '__new__') {
        const input = containerEl.querySelector('.new-account-name');
        if (input && input.value.trim()) return addSubAccount(select.dataset.parent, input.value.trim(), 'فرعي');
        return null;
      }
      return select.value;
    }

    function addContractType(newType) {
      if (!AppData.contractTypes.includes(newType)) {
        AppData.contractTypes.push(newType);
        saveData();
        return true;
      }
      return false;
    }

    function addTrainingMedia(trainingId, type, url, title) {
      AppData.trainingMedia.push({ id: 'tm' + Date.now(), trainingId, type, url, title: title || 'بدون عنوان' });
      saveData();
    }

    function deleteTrainingMedia(mediaId) {
      AppData.trainingMedia = AppData.trainingMedia.filter(m => m.id !== mediaId);
      saveData();
    }

    function saveData() { localStorage.setItem('agrios_v18', JSON.stringify(AppData)); }
    function loadData() {
      const raw = localStorage.getItem('agrios_v18');
      if (raw) Object.assign(AppData, JSON.parse(raw));
      else {
        addSubAccount('2310', 'علي أحمد', 'موظف');
        addSubAccount('2210', 'شركة الكلثوم', 'مورد');
        addSubAccount('1230', 'عميل نقدي', 'مدين');
        const budgetAcc = addSubAccount('1240', 'مزرعة فراولة', 'ميزانية مشروع');
        const storeAcc = addSubAccount('5200', 'فراولة', 'إنتاج جاهز');
        const projId = 'p1';
        AppData.projects.push({
          id: projId, name: 'مزرعة فراولة', budget: 18000, location: 'حقل 5', crop: 'فراولة',
          budgetAccount: budgetAcc, produceStoreAccount: storeAcc, createdAt: '2026-01-01',
          phases: [
            { id: 'ph1', name: 'تجهيز الأرض', start: '2026-09-01', end: '2026-09-20', budget: 5000, spent: 0 },
            { id: 'ph2', name: 'زراعة', start: '2026-09-21', end: '2026-10-15', budget: 4000, spent: 0 }
          ],
          risks: [{ desc: 'تأخر الأمطار', impact: 'متوسط', mitigation: 'ري تكميلي' }],
          kpis: [{ id: 'kpi1', name: 'تقدم المهام', value: 0, unit: '%' }, { id: 'kpi2', name: 'الميزانية المتبقية', value: 100, unit: '%' }]
        });
        AppData.inventory.push({ id: 'inv-prod-p1', name: 'فراولة طازجة', category: 'إنتاج جاهز', quantity: 0, unit: 'كجم', expenseAccount: storeAcc, expiryDate: '2027-06-01', projectId: projId, createdAt: '2026-01-01' });
        AppData.inventory.push({ id: 'inv-mat-1', name: 'سماد يوريا', category: 'أسمدة', quantity: 100, unit: 'كجم', expenseAccount: '5100', expiryDate: '2026-12-31', createdAt: '2026-01-01' });
        AppData.personnel.push({ id: 'emp1', name: 'علي أحمد', account: '2310-عليأحمد', totalAccrued: 0, totalPaid: 0, birthDate: '1990-05-15', phone: '0123456789', address: 'الخرطوم', nationalId: '123456789', startDate: '2025-01-01', contractEndDate: '2027-01-01', vacationDays: 15, image: '', createdAt: '2026-01-01' });
        AppData.suppliers.push({ id: 'sup1', name: 'شركة الكلثوم', account: '2210-شركةالكلثوم', createdAt: '2026-01-01' });
        AppData.assets.push({ id: 'ast1', name: 'مضخة ري', account: addSubAccount('1220', 'مضخة ري', 'أصل'), maintenanceAccount: addSubAccount('5400', 'صيانة-مضخةري', 'صيانة'), createdAt: '2026-01-01' });
        AppData.tasks.push({ id: 't1', title: 'حرث أرض المشروع', cost: 500, projectId: projId, projectName: 'مزرعة فراولة', personId: 'emp1', personName: 'علي أحمد', done: false, phaseId: 'ph1', date: '2026-09-01', createdAt: '2026-01-01' });
        AppData.calendarEntries.push({ id: 'cal1', projectId: projId, crop: 'فراولة', area: '2 هكتار', plantDate: '2026-09-21', operations: [{ date: '2026-09-21', desc: 'زراعة الشتلات', cost: 3000, done: false, phaseId: 'ph2', personId: 'emp1' }], createdAt: '2026-01-01' });
        AppData.treasury.openingBalance = 5000;
        AppData.treasury.transactions.push({ id: 't0', date: '2026-06-01', type: 'مقبوضات', amount: 5000, desc: 'رصيد افتتاحي', relatedAccount: '1210' });
        AppData.banks.push({ id: 'bank1', name: 'بنك المزرعة', account: addSubAccount('1210', 'بنك المزرعة', 'بنك'), createdAt: '2026-01-01' });
        AppData.bankTransactions.push({ id: 'bt1', bankId: 'bank1', date: '2026-06-01', type: 'إيداع', amount: 10000, desc: 'إيداع أولي', relatedAccount: '1210' });
        AppData.checks.push({ id: 'chk1', checkNumber: '1001', bankId: 'bank1', type: 'مستلم', from: 'عميل أ', amount: 3000, dueDate: '2026-07-15', status: 'مستحق', relatedAccount: '1230-عميلنقدي', date: '2026-01-01' });
        AppData.knowledge.push({ id: 'k1', content: 'أفضل موعد لزراعة الفراولة هو سبتمبر', tags: 'زراعة, فراولة', createdAt: '2026-01-01' });
        AppData.channels.push({ id: 'msg1', text: 'مرحباً بكم في نظام AgriOS', timestamp: new Date().toLocaleString() });
        saveData();
      }
    }

    const tabs = ['لوحة القيادة', 'الخزينة', 'البنوك', 'المشاريع', 'خطة المشروع', 'المخزون', 'الموظفون', 'المهام', 'الروزنامة', 'الموردون', 'المبيعات', 'الخدمات', 'العقود', 'الأصول', 'التدريب', 'المعرفة', 'القنوات', 'الإعدادات', 'التقارير'];
    let currentTab = 'لوحة القيادة';
    window.selectedProjectId = null;

    function renderTabs() {
      document.getElementById('mainTabs').innerHTML = tabs.map(t =>
        `<button class="${t === currentTab ? 'active' : ''}" onclick="switchTab('${t}')">${t}</button>`
      ).join('');
    }

    function switchTab(tabName) { currentTab = tabName; renderTabs(); renderContent(); }

    function renderContent() {
      const container = document.getElementById('tabContainer');
      container.innerHTML = `<div class="tab-content" id="tab-${currentTab}"></div>`;
      const el = document.getElementById(`tab-${currentTab}`);
      const renderers = {
        'لوحة القيادة': renderDashboard, 'الخزينة': renderTreasury, 'البنوك': renderBanks,
        'المشاريع': renderProjects, 'خطة المشروع': renderProjectPlan, 'المخزون': renderInventory,
        'الموظفون': renderPersonnel, 'المهام': renderTasks, 'الروزنامة': renderCalendar,
        'الموردون': renderSuppliers, 'المبيعات': renderSales, 'الخدمات': renderServices,
        'العقود': renderContracts, 'الأصول': renderAssets, 'التدريب': renderTraining,
        'المعرفة': renderKnowledge, 'القنوات': renderChannels, 'الإعدادات': renderSettings, 'التقارير': renderReports
      };
      if (renderers[currentTab]) renderers[currentTab](el);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }function renderDashboard(el) {
  const totalTasks = AppData.tasks.length;
  const doneTasks = AppData.tasks.filter(t => t.done).length;
  const totalBudget = AppData.projects.reduce((s, p) => s + p.budget, 0);
  const totalSpent = AppData.projects.reduce((s, p) => s + p.phases.reduce((ps, ph) => ps + ph.spent, 0), 0);
  const schedulePercent = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 100;
  const budgetRemaining = totalBudget ? Math.round(((totalBudget - totalSpent) / totalBudget) * 100) : 100;
  const treasuryBalance = getTreasuryBalance();
  const today = new Date().toISOString().split('T')[0];
  const nextWeek = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
  const dueToday = AppData.checks.filter(c => c.status === 'مستحق' && c.dueDate <= today);
  const dueSoon = AppData.checks.filter(c => c.status === 'مستحق' && c.dueDate > today && c.dueDate <= nextWeek);
  const totalReceivables = AppData.journalEntries.filter(j => j.debit.startsWith('1230')).reduce((s, j) => s + j.amount, 0) - AppData.journalEntries.filter(j => j.credit.startsWith('1230')).reduce((s, j) => s + j.amount, 0);
  const totalPayables = AppData.journalEntries.filter(j => j.credit.startsWith('2210')).reduce((s, j) => s + j.amount, 0) - AppData.journalEntries.filter(j => j.debit.startsWith('2210')).reduce((s, j) => s + j.amount, 0);
  const liquidityRatio = totalPayables > 0 ? (treasuryBalance / totalPayables).toFixed(2) : '∞';

  el.innerHTML = `<h2>لوحة القيادة</h2>
    <div class="grid-3">
      <div class="card"><h3>💰 الخزينة</h3><p style="font-size:24px;">${treasuryBalance.toFixed(2)} $</p></div>
      <div class="card"><h3>📊 تقدم المهام</h3><p>${schedulePercent}% (${doneTasks}/${totalTasks})</p></div>
      <div class="card"><h3>📋 المشاريع</h3><p>${AppData.projects.length} مشروع</p></div>
      <div class="card"><h3>🏦 البنوك</h3><p>${AppData.banks.length} حساب</p></div>
      <div class="card"><h3>⚠️ شيكات اليوم</h3><p style="color:${dueToday.length ? 'red' : 'green'}">${dueToday.length} شيك</p></div>
      <div class="card"><h3>⏰ شيكات قريبة</h3><p style="color:${dueSoon.length ? 'orange' : 'green'}">${dueSoon.length} شيك خلال 7 أيام</p></div>
      <div class="card"><h3>📊 نسبة استخدام الميزانية</h3><p style="font-size:20px;">${budgetRemaining}%</p></div>
      <div class="card"><h3>💳 الذمم المدينة</h3><p style="font-size:20px;">${totalReceivables.toFixed(2)} $</p></div>
      <div class="card"><h3>📋 الذمم الدائنة</h3><p style="font-size:20px;">${totalPayables.toFixed(2)} $</p></div>
      <div class="card"><h3>🔍 نسبة السيولة</h3><p style="font-size:20px;">${liquidityRatio}</p></div>
    </div>
    ${dueToday.length > 0 ? `<div class="card" style="background:#ffebee;"><h3>🚨 شيكات مستحقة اليوم</h3><table>${dueToday.map(c => `<tr><td>${c.checkNumber}</td><td>${c.type}</td><td>${c.amount} $</td></tr>`).join('')}</table></div>` : ''}
    ${dueSoon.length > 0 ? `<div class="card" style="background:#fff8e1;"><h3>📅 شيكات تستحق قريباً</h3><table>${dueSoon.map(c => `<tr><td>${c.checkNumber}</td><td>${c.type}</td><td>${c.amount} $</td><td>${c.dueDate}</td></tr>`).join('')}</table></div>` : ''}`;
}

// ======================== الخزينة (مركز العمليات اليومية) ========================
function renderTreasury(el) {
  const balance = getTreasuryBalance();
  const today = new Date().toISOString().split('T')[0];
  const dueChecks = AppData.checks.filter(c => c.status === 'مستحق' && c.dueDate <= today);
  const collectibleChecks = dueChecks.filter(c => c.type === 'مستلم');
  const payableChecks = dueChecks.filter(c => c.type === 'واجب الدفع');
  const recentInvoices = [
    ...AppData.salesInvoices.slice(-5).map(inv => ({...inv, invType: 'فاتورة بيع'})),
    ...AppData.purchaseInvoices.slice(-5).map(inv => ({...inv, invType: 'فاتورة شراء'})),
    ...AppData.serviceSalesInvoices.slice(-5).map(inv => ({...inv, invType: 'بيع خدمات'})),
    ...AppData.servicePurchaseInvoices.slice(-5).map(inv => ({...inv, invType: 'شراء خدمات'}))
  ].sort((a,b) => b.date.localeCompare(a.date)).slice(0,10);

  el.innerHTML = `<h2>الخزينة - مركز العمليات اليومية</h2>
    <div class="card" style="background:#e8f5e9;"><h3>💰 الرصيد الحالي: ${balance.toFixed(2)} $</h3></div>
    ${dueChecks.length > 0 ? `<div class="card" style="background:#ffebee;">
      <h3>⚠️ تنبيهات الشيكات المستحقة اليوم</h3>
      ${collectibleChecks.length > 0 ? `<p><strong>📥 شيكات يجب تحصيلها:</strong> ${collectibleChecks.map(c => `#${c.checkNumber} (${c.amount}$)`).join(', ')}</p>` : ''}
      ${payableChecks.length > 0 ? `<p><strong>📤 شيكات يجب دفعها:</strong> ${payableChecks.map(c => `#${c.checkNumber} (${c.amount}$)`).join(', ')}</p>` : ''}
    </div>` : ''}
    <div class="flex-row" style="margin-bottom:20px;">
      <button onclick="openModal('treasuryMovement')">➕ حركة خزينة</button>

function deleteBank(id) { if(!confirm('حذف البنك؟')) return; AppData.banks = AppData.banks.filter(b => b.id !== id); AppData.bankTransactions = AppData.bankTransactions.filter(t => t.bankId !== id); AppData.checks = AppData.checks.filter(c => c.bankId !== id); saveData(); renderContent(); showToast('تم الحذف'); }

function cashCheck(checkId) {
  const check = AppData.checks.find(c => c.id === checkId);
  if (!check || check.status !== 'مستحق') return;
  check.status = 'مصروف';
  if (check.type === 'مستلم') {
    addTreasuryMovement('مقبوضات', check.amount, `تحصيل شيك رقم ${check.checkNumber}`, check.relatedAccount);
    addBankTransaction(check.bankId, 'إيداع', check.amount, `تحصيل شيك ${check.checkNumber}`, '1210');
    genJE('1210', check.relatedAccount, check.amount, `تحصيل شيك ${check.checkNumber}`);
  } else {
    addTreasuryMovement('مدفوعات', check.amount, `صرف شيك رقم ${check.checkNumber}`, check.relatedAccount);
    addBankTransaction(check.bankId, 'سحب', check.amount, `صرف شيك ${check.checkNumber}`, '1210');
    genJE(check.relatedAccount, '1210', check.amount, `صرف شيك ${check.checkNumber}`);
  }
  saveData(); renderContent(); showToast('تم صرف الشيك');
}

function getExpiryWarning(dateStr) { if (!dateStr) return ''; const today = new Date(); today.setHours(0,0,0,0); const diffDays = Math.ceil((new Date(dateStr) - today) / (1000*60*60*24)); if (diffDays < 0) return 'منتهية'; if (diffDays <= 30) return `متبقي ${diffDays} يوم`; return ''; }

function completeTask(taskId) {
  const task = AppData.tasks.find(t => t.id === taskId); if (!task || task.done) return; task.done = true;
  if (task.personId) { const emp = AppData.personnel.find(e => e.id === task.personId); if (emp) emp.totalAccrued += task.cost; }
  if (task.phaseId && task.projectId) { const proj = AppData.projects.find(p => p.id === task.projectId); if (proj) { const ph = proj.phases.find(p => p.id === task.phaseId); if (ph) ph.spent += task.cost; } }
  genJE('5100', task.personId ? AppData.personnel.find(e=>e.id===task.personId)?.account : '1210', task.cost, 'مهمة: '+task.title);
  saveData(); renderContent(); showToast('تم إنجاز المهمة');
}

function completeCalendarOp(entryId, opDate) {
  const entry = AppData.calendarEntries.find(e => e.id === entryId); if (!entry) return;
  const op = entry.operations.find(o => o.date === opDate); if (!op || op.done) return; op.done = true;
  AppData.tasks.push({ id: 't-cal-'+Date.now(), title: op.desc + ' (روزنامة)', cost: op.cost, projectId: entry.projectId, projectName: AppData.projects.find(p=>p.id===entry.projectId)?.name||'', personId: op.personId, personName: AppData.personnel.find(e=>e.id===op.personId)?.name||'', done: true, phaseId: op.phaseId, date: opDate, createdAt: new Date().toISOString().slice(0,10) });
  if (op.personId) { const emp = AppData.personnel.find(e => e.id === op.personId); if (emp) emp.totalAccrued += op.cost; }
  if (op.phaseId && entry.projectId) { const proj = AppData.projects.find(p => p.id === entry.projectId); if (proj) { const ph = proj.phases.find(p => p.id === op.phaseId); if (ph) ph.spent += op.cost; } }
  genJE('5100', op.personId ? AppData.personnel.find(e=>e.id===op.personId)?.account : '1210', op.cost, 'عملية روزنامة: '+op.desc);
  saveData(); renderContent(); showToast('تم إنجاز العملية');
}

      <button onclick="payContract('${c.id}')">💵 دفعة</button>
      <button class="edit-btn" onclick="openModal('contract','${c.id}')">✏️</button>

function payContract(contractId) {
  const contract = AppData.contracts.find(c => c.id === contractId);
  const remaining = contract.totalAmount - contract.paid;
  const amount = parseFloat(prompt(`المبلغ (المتبقي: ${remaining})`, remaining));
  if (isNaN(amount) || amount <= 0 || amount > remaining) return;
  contract.paid += amount;
  genJE(contract.account, '1210', amount, 'دفعة عقد ' + contract.title);
  addTreasuryMovement('مدفوعات', amount, 'دفعة عقد ' + contract.title, contract.account);
  saveData(); renderContent(); showToast('تم الدفع');
}

function deleteContract(id) {
  if (!confirm('حذف العقد؟')) return;
  AppData.contracts = AppData.contracts.filter(c => c.id !== id);
  saveData(); renderContent(); showToast('تم الحذف');
}

function renderTraining(el) {

  document.getElementById('trainingList').innerHTML = AppData.training.map(t => {
    const mediaItems = AppData.trainingMedia.filter(m => m.trainingId === t.id);
    let mediaHtml = '';
    if (mediaItems.length > 0) {
      mediaHtml = '<div style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;"><strong>📂 مكتبة المحتوى:</strong><div style="display:flex; gap:15px; flex-wrap:wrap; margin-top:8px;">';
      mediaItems.forEach(m => {
        if (m.type === 'image') mediaHtml += `<div style="text-align:center;"><img src="${m.url}" style="max-width:100px; max-height:100px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);" title="${m.title}"><br><small>${m.title}</small></div>`;
        else if (m.type === 'video') mediaHtml += `<div style="text-align:center;"><video src="${m.url}" controls style="max-width:150px; border-radius:8px;" title="${m.title}"></video><br><small>${m.title}</small></div>`;
        else if (m.type === 'document') mediaHtml += `<div style="text-align:center; background:#f5f5f5; padding:10px; border-radius:8px;"><a href="${m.url}" target="_blank" title="${m.title}" style="text-decoration:none; color:var(--primary);">📄 ${m.title}</a></div>`;
        mediaHtml += `<button class="danger" onclick="deleteTrainingMedia('${m.id}')" style="font-size:10px; padding:2px 6px; margin-top:4px;">🗑️</button>`;
      });
      mediaHtml += '</div></div>';
    }
    return `<div class="card">
      <strong>${t.title}</strong> (${t.date})<br><p>${t.description}</p>
      <p>المدرب: ${t.trainer||''} | التكلفة: ${t.cost||0} $</p>

function saveTrainingMediaFromModal() {
  const trainingId = document.getElementById('mediaTrainingId').value;
  const type = document.getElementById('mediaType').value;
  const title = document.getElementById('mediaTitle').value.trim();
  const url = document.getElementById('mediaUrl').value.trim();
  const fileInput = document.getElementById('mediaFileInput');
  if (fileInput && fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = function(e) {
      addTrainingMedia(trainingId, type, e.target.result, title || fileInput.files[0].name);
      closeModal(); renderContent(); showToast('تمت إضافة الوسيط من الملف');
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else if (url) {
    addTrainingMedia(trainingId, type, url, title || 'وسيط');
    closeModal(); renderContent(); showToast('تمت إضافة الوسيط');
  } else {
    showToast('يرجى اختيار ملف أو إدخال رابط');
  }
}

function sendChannelMessage() {
  const text = document.getElementById('channelMsg').value.trim();
  if (!text) return;
  const timestamp = new Date().toLocaleString();
  AppData.channels.push({ id: 'msg'+Date.now(), text, timestamp });
  if (text.startsWith('/مهمة')) {
    const taskDesc = text.replace('/مهمة', '').trim();
    if (taskDesc) {
      AppData.tasks.push({ id: 't'+Date.now(), title: taskDesc, cost: 0, projectId: null, phaseId: null, personId: null, done: false, projectName: '', personName: '', date: new Date().toISOString().slice(0,10), createdAt: new Date().toISOString().slice(0,10) });
      showToast('تم إنشاء مهمة: ' + taskDesc);
    }
  }
  saveData(); renderContent();
}

function exportData() {
  const dataStr = JSON.stringify(AppData, null, 2);
  const blob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'agrios_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
  showToast('تم تصدير البيانات');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      Object.assign(AppData, data);
      saveData(); renderContent();
      showToast('تم استيراد البيانات بنجاح');
    } catch (err) { showToast('خطأ في الملف'); }
  };
  reader.readAsText(file);
}

function applyReportFilter() {
  const type = document.getElementById('reportType')?.value || 'all';
  const from = document.getElementById('reportDateFrom')?.value || '';
  const to = document.getElementById('reportDateTo')?.value || '';
  let results = [];
  
  function getItemDate(item) {
    return item.date || item.dueDate || item.startDate || item.plantDate || item.createdAt || '';
  }
  
  function matchItemDate(item) {
    const itemDate = getItemDate(item);
    if (!itemDate) return !from && !to;
    if (from && itemDate < from) return false;
    if (to && itemDate > to) return false;
    return true;
  }
  
  if (type === 'all' || type === 'sales') {
    AppData.salesInvoices.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'مبيعات بضاعة', displayDate: inv.date, total: inv.total, desc: inv.customerName||''}); });
    AppData.salesReturns.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'مرتجع مبيعات', displayDate: inv.date, total: -inv.total, desc: inv.customerName||''}); });
  }
  if (type === 'all' || type === 'purchases') {
    AppData.purchaseInvoices.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'مشتريات بضاعة', displayDate: inv.date, total: inv.total, desc: AppData.suppliers.find(s=>s.id===inv.supplierId)?.name||''}); });
    AppData.purchaseReturns.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'مرتجع مشتريات', displayDate: inv.date, total: -inv.total, desc: AppData.suppliers.find(s=>s.id===inv.supplierId)?.name||''}); });
  }
  if (type === 'all' || type === 'services') {
    AppData.serviceSalesInvoices.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'بيع خدمات', displayDate: inv.date, total: inv.total, desc: inv.description||''}); });
    AppData.serviceSalesReturns.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'مرتجع بيع خدمات', displayDate: inv.date, total: -inv.total, desc: inv.description||''}); });
    AppData.servicePurchaseInvoices.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'شراء خدمات', displayDate: inv.date, total: inv.total, desc: inv.description||''}); });
    AppData.servicePurchaseReturns.forEach(inv => { if (matchItemDate(inv)) results.push({...inv, category: 'مرتجع شراء خدمات', displayDate: inv.date, total: -inv.total, desc: inv.description||''}); });
  }
  if (type === 'all' || type === 'treasury') {
    AppData.treasury.transactions.forEach(t => { if (matchItemDate(t)) results.push({...t, category: 'خزينة', displayDate: t.date, total: t.type==='مقبوضات'?t.amount:-t.amount, desc: t.desc}); });
  }
  if (type === 'all' || type === 'banks') {
    AppData.bankTransactions.forEach(t => { if (matchItemDate(t)) results.push({...t, category: 'حركة بنكية', displayDate: t.date, total: t.type==='إيداع'?t.amount:-t.amount, desc: t.desc}); });
  }
  if (type === 'all' || type === 'checks') {
    AppData.checks.forEach(c => { if (matchItemDate(c)) results.push({...c, category: 'شيكات', displayDate: c.dueDate, total: c.amount, desc: `شيك ${c.checkNumber}`}); });
  }
  if (type === 'all' || type === 'tasks') {
    AppData.tasks.forEach(t => { if (matchItemDate(t)) results.push({...t, category: 'مهام', displayDate: t.date||t.createdAt||'', total: t.cost, desc: t.title}); });
  }
  if (type === 'all' || type === 'inventory') {
    AppData.inventory.forEach(i => { results.push({...i, category: 'مخزون', displayDate: i.createdAt||'', total: i.quantity, desc: i.name}); });
  }
  if (type === 'budget') {
    AppData.projects.forEach(p => {
      const spent = p.phases.reduce((s, ph) => s + ph.spent, 0);
      results.push({ category: 'ميزانية مشروع', displayDate: p.createdAt||'', desc: p.name, total: p.budget, spent: spent, remaining: p.budget - spent });
    });
  }
  if (type === 'cashflow') {
    const allTransactions = [
      ...AppData.treasury.transactions.map(t => ({...t, source: 'خزينة'})),
      ...AppData.bankTransactions.map(t => ({...t, source: 'بنك'}))
    ];
    allTransactions.sort((a,b) => (a.date||'').localeCompare(b.date||''));
    let runningBalance = 0;
    allTransactions.forEach(t => {
      const amount = t.type === 'إيداع' || t.type === 'مقبوضات' ? t.amount : -t.amount;
      runningBalance += amount;
      if (matchItemDate(t)) {
        results.push({ category: 'تدفق نقدي', displayDate: t.date, desc: t.desc || `${t.source} - ${t.type}`, total: amount, balance: runningBalance });
      }
    });
  }
  
  results.sort((a,b) => (b.displayDate||'').localeCompare(a.displayDate||''));
  const total = results.reduce((s, r) => s + (r.total||0), 0);
  let tableRows = '';
  
  if (type === 'budget') {
    tableRows = results.map(r => `<tr><td>${r.displayDate||''}</td><td>${r.desc}</td><td>${r.total.toFixed(2)}</td><td>${(r.spent||0).toFixed(2)}</td><td>${(r.remaining||0).toFixed(2)}</td><td>${r.total > 0 ? Math.round(((r.spent||0)/r.total)*100) : 0}%</td></tr>`).join('');
    document.getElementById('reportResults').innerHTML = `<div class="card"><h3>تقرير الميزانيات (${results.length} مشروع)</h3><table><tr><th>تاريخ الإنشاء</th><th>المشروع</th><th>الميزانية</th><th>المصروف</th><th>المتبقي</th><th>نسبة الصرف</th></tr>${tableRows}</table></div>`;
  } else if (type === 'cashflow') {
    tableRows = results.map(r => `<tr><td>${r.displayDate||''}</td><td>${r.desc}</td><td style="color:${(r.total||0)>=0?'green':'red'}">${(r.total||0).toFixed(2)}</td><td>${(r.balance||0).toFixed(2)}</td></tr>`).join('');
    document.getElementById('reportResults').innerHTML = `<div class="card"><h3>التدفقات النقدية (${results.length} حركة)</h3><table><tr><th>التاريخ</th><th>الوصف</th><th>المبلغ</th><th>الرصيد التراكمي</th></tr>${tableRows}</table></div>`;
  } else {
    tableRows = results.map(r => `<tr><td>${r.displayDate||'-'}</td><td>${r.category||''}</td><td>${r.desc||''}</td><td style="color:${(r.total||0)>=0?'green':'red'}">${(r.total||0).toFixed(2)}</td></tr>`).join('');
    document.getElementById('reportResults').innerHTML = `<div class="card"><h3>النتائج (${results.length} عنصر، الإجمالي: ${total.toFixed(2)})</h3><table><tr><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>المبلغ</th></tr>${tableRows}</table></div>`;
  }
}

function openNewCropModal() {
  const modal = document.getElementById('genericModal'); const content = document.getElementById('modalContent');
  content.innerHTML = `<h3>إضافة محصول جديد</h3>
    <input id="newCropName" placeholder="اسم المحصول">
    <input id="newCropOpCount" type="number" placeholder="عدد العمليات" value="1" min="1">
    <div id="newCropOps"></div>
    <button onclick="addCropFields()">➕ إضافة حقول العمليات</button>
    <button onclick="saveNewCropTemplate()">حفظ المحصول</button>
    <button class="secondary" onclick="closeModal()">إلغاء</button>`;
  addCropFields();
  modal.classList.add('active');
}

function addCropFields() {
  const count = parseInt(document.getElementById('newCropOpCount').value) || 1;
  const container = document.getElementById('newCropOps');
  let html = '';
  for (let i = 0; i < count; i++) {
    html += `<div style="border:1px solid #ddd; padding:8px; margin:5px 0; border-radius:5px;">
      <input placeholder="وصف العملية ${i+1}" id="cropOpDesc${i}">
      <input type="number" placeholder="اليوم (بعد الزراعة)" id="cropOpDay${i}">
      <input type="number" placeholder="التكلفة" id="cropOpCost${i}">
    </div>`;
  }
  container.innerHTML = html;
}

function saveNewCropTemplate() {
  const name = document.getElementById('newCropName').value.trim();
  if (!name) return showToast('أدخل اسم المحصول');
  const count = parseInt(document.getElementById('newCropOpCount').value) || 1;
  const operations = [];
  for (let i = 0; i < count; i++) {
    const desc = document.getElementById(`cropOpDesc${i}`)?.value.trim();

    function saveBankReconciliation() {
      const bankId = document.getElementById('recBankId').value;
      const actualBalance = parseFloat(document.getElementById('recActualBalance').value);
      const bankFees = parseFloat(document.getElementById('recBankFees').value) || 0;
      const bankRevenue = parseFloat(document.getElementById('recBankRevenue').value) || 0;
      const desc = document.getElementById('recDesc').value.trim() || new Date().toISOString().split('T')[0];
      if (isNaN(actualBalance)) return showToast('يرجى إدخال الرصيد الفعلي');
      const bank = AppData.banks.find(b => b.id === bankId);
      const bookBalance = AppData.bankTransactions.filter(t => t.bankId === bankId).reduce((s, t) => s + (t.type === 'إيداع' ? t.amount : -t.amount), 0);
      const difference = actualBalance - bookBalance;
      AppData.bankReconciliations.push({ id: 'rec'+Date.now(), bankId, date: new Date().toISOString().split('T')[0], actualBalance, bookBalance, difference, bankFees, bankRevenue, desc });
      if (bankFees > 0) { genJE('5800', bank.account, bankFees, 'مصروفات بنكية - ' + desc); addTreasuryMovement('مدفوعات', bankFees, 'مصروفات بنكية - ' + desc, '5800'); }
      if (bankRevenue > 0) { genJE(bank.account, '4200', bankRevenue, 'إيرادات بنكية - ' + desc); addTreasuryMovement('مقبوضات', bankRevenue, 'إيرادات بنكية - ' + desc, '4200'); }
      if (Math.abs(difference - (bankRevenue - bankFees)) > 0.001) {
        const unexplained = difference - (bankRevenue - bankFees);
        if (unexplained > 0) { genJE(bank.account, '4200', unexplained, 'فروقات تسوية غير مفسرة - ' + desc); addTreasuryMovement('مقبوضات', unexplained, 'فروقات تسوية بنكية', '4200'); }
        else { genJE('5800', bank.account, Math.abs(unexplained), 'فروقات تسوية غير مفسرة - ' + desc); addTreasuryMovement('مدفوعات', Math.abs(unexplained), 'فروقات تسوية بنكية', '5800'); }
      }
      saveData(); closeModal(); renderContent(); showToast('تمت التسوية وتسجيل القيود');
    }

      let trainingId;
      if (id) { const t = AppData.training.find(x => x.id === id); if (t) { t.title=title; t.date=date; t.description=description; t.trainer=trainer; t.cost=cost; t.expenseAccount=expenseAccount; } trainingId = id; }
      else { trainingId = 'tr' + Date.now(); AppData.training.push({ id: trainingId, title, date, description, trainer, cost, expenseAccount, createdAt: new Date().toISOString().slice(0,10) }); }
      const files = document.getElementById('trainMediaFiles').files;
      if (files && files.length > 0) {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const reader = new FileReader();
          reader.onload = function(e) {
            const dataUrl = e.target.result;
            let mediaType = 'document';
            if (file.type.startsWith('image/')) mediaType = 'image';
            else if (file.type.startsWith('video/')) mediaType = 'video';
            addTrainingMedia(trainingId, mediaType, dataUrl, file.name);
          };
          reader.readAsDataURL(file);
        }
      }
      if (expenseAccount && cost > 0) { genJE(expenseAccount, '1210', cost, 'تدريب: ' + title); addTreasuryMovement('مدفوعات', cost, 'تدريب: ' + title, expenseAccount); }
      saveData(); closeModal(); renderContent(); showToast(id ? 'تم تعديل الدورة وحفظ الوسائط' : 'تمت إضافة الدورة مع الوسائط');
    }

    function saveKnowledge() {
      const content = document.getElementById('knowContent').value.trim(); const tags = document.getElementById('knowTags').value.trim();
      const id = document.getElementById('editId').value;
      if (!content) return;
      if (id) { const k = AppData.knowledge.find(x => x.id === id); if (k) { k.content=content; k.tags=tags; } }
      else AppData.knowledge.push({ id: 'k'+Date.now(), content, tags, createdAt: new Date().toISOString().slice(0,10) });
      saveData(); closeModal(); renderContent(); showToast(id?'تم التعديل':'تمت الإضافة');
    }

    // ======================== بدء التشغيل ========================
    window.onload = function () {
      loadData();
      renderTabs();
      renderContent();
    };
  </script>
</body>
</html>
